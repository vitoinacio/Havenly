<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/security"></ion-back-button>
    </ion-buttons>
    <ion-title>Alterar Senha</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" id="containerPage">
  <div class="container">
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Senha Atual</label>
        <div class="password-row">
          <ion-input
            [type]="show.current ? 'text' : 'password'"
            placeholder="Digite sua senha atual"
            name="currentPassword"
            [(ngModel)]="form.currentPassword"
            required
          ></ion-input>
          <ion-button
            class="eye-btn"
            fill="clear"
            size="small"
            type="button"
            (click)="toggle('current')"
            aria-label="Mostrar/ocultar senha atual"
          >
            <ion-icon
              [name]="show.current ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </div>
        <small class="error" *ngIf="error.currentPassword"
          >{{ error.currentPassword }}</small
        >
      </div>

      <div class="form-group">
        <label>Nova Senha</label>
        <div class="password-row">
          <ion-input
            [type]="show.next ? 'text' : 'password'"
            placeholder="Digite a nova senha"
            name="newPassword"
            [(ngModel)]="form.newPassword"
            required
          ></ion-input>
          <ion-button
            class="eye-btn"
            fill="clear"
            size="small"
            type="button"
            (click)="toggle('next')"
            aria-label="Mostrar/ocultar nova senha"
          >
            <ion-icon
              [name]="show.next ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </div>
        <small class="error" *ngIf="error.newPassword"
          >{{ error.newPassword }}</small
        >
      </div>

      <div class="form-group">
        <label>Confirmar Nova Senha</label>
        <div class="password-row">
          <ion-input
            [type]="show.confirm ? 'text' : 'password'"
            placeholder="Confirme a nova senha"
            name="confirmPassword"
            [(ngModel)]="form.confirmPassword"
            required
          ></ion-input>
          <ion-button
            class="eye-btn"
            fill="clear"
            size="small"
            type="button"
            (click)="toggle('confirm')"
            aria-label="Mostrar/ocultar confirmação"
          >
            <ion-icon
              [name]="show.confirm ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </div>
        <small class="error" *ngIf="error.confirmPassword"
          >{{ error.confirmPassword }}</small
        >
      </div>

      <small class="error general" *ngIf="error.general"
        >{{ error.general }}</small
      >

      <ion-button expand="block" type="submit" [disabled]="submitDisabled">
        {{ loading ? 'Salvando...' : 'Salvar Senha' }}
      </ion-button>
    </form>
  </div>
</ion-content>
